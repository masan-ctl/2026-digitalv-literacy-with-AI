<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강의실 예약 및 신청 관리 시스템</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --secondary-color: #f5f7fa;
      --text-color: #333;
      --border-color: #e1e4e8;
      --danger-color: #e74c3c;
      --success-color: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; color: var(--text-color); background-color: #f9fbfd; padding: 20px; line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

    h1, h2, h3 { color: #2c3e50; margin-bottom: 15px; }
    .header-nav { display: flex; gap: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
    .nav-btn { padding: 10px 20px; border: none; background: #eef2f5; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.3s; }
    .nav-btn.active { background: var(--primary-color); color: #fff; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 달력 스타일 */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .day-header { font-weight: bold; padding: 10px; background: #f0f4f8; border-radius: 4px; }
    .day-cell { min-height: 90px; border: 1px solid var(--border-color); border-radius: 6px; padding: 5px; background: #fff; cursor: pointer; position: relative; }
    .day-cell.disabled { background: #f5f5f5; cursor: not-allowed; opacity: 0.6; }
    .day-number { font-weight: bold; text-align: left; font-size: 0.9em; }
    .holiday-icon { font-size: 0.8em; color: var(--danger-color); display: block; }
    .badge { display: block; font-size: 0.75em; padding: 2px 4px; border-radius: 3px; margin-top: 3px; color: #fff; background: var(--primary-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 폼 스타일 */
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #fff; background: var(--primary-color); }
    .btn-danger { background: var(--danger-color); }
    .btn-success { background: var(--success-color); }

    /* 테이블 스타일 */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid var(--border-color); padding: 10px; text-align: center; }
    th { background: #f8fa00; color: #333; }

    /* 모달 */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #fff; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-nav">
    <button class="nav-btn active" onclick="switchTab('calendar-tab')">달력 / 신청하기</button>
    <button class="nav-btn" onclick="switchTab('search-tab')">신청 내역 조회 및 관리</button>
    <button class="nav-btn" onclick="switchTab('admin-tab')">관리자 로그인</button>
  </div>

  <!-- 1. 달력 / 신청 탭 -->
  <div id="calendar-tab" class="tab-content active">
    <div class="calendar-header">
      <button class="btn" onclick="changeMonth(-1)">&lt; 이전달</button>
      <h2 id="current-month-title"></h2>
      <button class="btn" onclick="changeMonth(1)">다음달 &gt;</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <!-- 2. 신청 내역 조회 및 관리 탭 -->
  <div id="search-tab" class="tab-content">
    <h2>신청 내역 조회</h2>
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="search-name" placeholder="신청자 이름 입력">
      <input type="password" id="search-pw" placeholder="비밀번호 입력">
      <button class="btn" onclick="searchApplications()">조회하기</button>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- 3. 관리자 탭 -->
  <div id="admin-tab" class="tab-content">
    <h2>관리자 페이지</h2>
    <div id="admin-login-sec" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="password" id="admin-pw-input" placeholder="관리자 비밀번호">
      <button class="btn" onclick="adminLogin()">로그인</button>
    </div>
    <div id="admin-content-sec" style="display: none;">
      <p style="color: green; font-weight: bold; margin-bottom: 10px;">✓ 관리자 인증 완료</p>
      <button class="btn btn-danger" onclick="adminLogout()" style="margin-bottom: 15px;">로그아웃</button>
      <div id="admin-table-container"></div>
    </div>
  </div>
</div>

<!-- 신청 / 수정 모달 -->
<div id="app-modal" class="modal">
  <div class="modal-content">
    <h3 id="modal-title">강의실 신청하기</h3>
    <form id="app-form" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="form-row-id" value="">
      <input type="hidden" id="form-action" value="create">

      <div class="form-group">
        <label>1순위 희망일 (강의 시작일: 9월 16일 이후)</label>
        <input type="date" id="form-date" required min="2026-09-16">
      </div>
      <div class="form-group">
        <label>1순위 시간</label>
        <input type="text" id="form-time" placeholder="예: 10:00 - 12:00" required>
      </div>
      <div class="form-group">
        <label>강의실</label>
        <input type="text" id="form-room" required placeholder="강의실 입력">
      </div>
      <div class="form-group">
        <label>신청인원</label>
        <input type="number" id="form-count" required min="1">
      </div>
      <div class="form-group">
        <label>학과명</label>
        <input type="text" id="form-dept" required>
      </div>
      <div class="form-group">
        <label>분반명</label>
        <input type="text" id="form-className" required>
      </div>
      <div class="form-group">
        <label>2순위 가능일시</label>
        <input type="text" id="form-priority2">
      </div>
      <div class="form-group">
        <label>3순위 가능일시</label>
        <input type="text" id="form-priority3">
      </div>
      <div class="form-group">
        <label>특이사항</label>
        <textarea id="form-note" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>신청자 이름</label>
        <input type="text" id="form-applicantName" required>
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="form-pw" required placeholder="비밀번호 설정">
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end;">
        <button type="button" class="btn btn-danger" onclick="closeModal()">취소</button>
        <button type="submit" class="btn btn-success">저장하기</button>
      </div>
    </form>
  </div>
</div>

<script>
  // 새 앱스크립트 웹앱 URL 설정
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1K11q3UOwjW1oUhoUkX6TaEQDJRXCf1Iu5q9tra6PBkwBfxENm5Wqk1kmrOaUPfHaPQ/exec";

  let currentDate = new Date(2026, 8, 1); // 2026년 9월
  let allData = [];
  let isAdminLoggedIn = false;

  // 10월 공휴일 정보 (예쁜 그림/이모지 반영)
  const HOLIDAYS = {
    "2026-10-03": "🇰🇷 개천절",
    "2026-10-09": "🇰🇷 한글날",
    "2026-10-24": "🌕 추석 연휴",
    "2026-10-25": "🌕 추석",
    "2026-10-26": "🌕 추석 연휴"
  };

  window.onload = function() {
    fetchData();
  };

  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');

    if (tabId === 'calendar-tab') renderCalendar();
  }

  // 데이터 불러오기 (JSONP)
  function fetchData() {
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?callback=handleDataResponse`;
    document.body.appendChild(script);
  }

  function handleDataResponse(response) {
    if (response && response.data) {
      allData = response.data;
      renderCalendar();
      if (isAdminLoggedIn) renderAdminTable();
    }
  }

  // 달력 렌더링
  function renderCalendar() {
    const grid = document.getElementById('calendar-grid');
    grid.innerHTML = '';

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('current-month-title').innerText = `${year}년 ${month + 1}월`;

    const dayHeaders = ['일', '월', '화', '수', '목', '금', '토'];
    dayHeaders.forEach(dh => {
      grid.innerHTML += `<div class="day-header">${dh}</div>`;
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="day-cell disabled"></div>`;
    }

    const minAllowedDate = new Date("2026-09-16");

    for (let d = 1; d <= lastDate; d++) {
      const thisDate = new Date(year, month, d);
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      
      const isDisabled = thisDate < minAllowedDate;
      const holidayText = HOLIDAYS[dateStr] ? `<span class="holiday-icon">${HOLIDAYS[dateStr]}</span>` : '';

      // 해당 날짜 신청 데이터 추출
      const dayApps = allData.filter(item => item['1순위 희망일'] === dateStr);
      let badgesHtml = '';
      dayApps.forEach(app => {
        badgesHtml += `<span class="badge" title="${app['학과명']} ${app['강의실']}">${app['학과명']} (${app['강의실']})</span>`;
      });

      const cell = document.createElement('div');
      cell.className = `day-cell ${isDisabled ? 'disabled' : ''}`;
      cell.innerHTML = `
        <div class="day-number">${d}</div>
        ${holidayText}
        ${badgesHtml}
      `;

      if (!isDisabled) {
        cell.onclick = () => openModalForCreate(dateStr);
      }

      grid.appendChild(cell);
    }
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  // 모달 열기 (신규 작성)
  function openModalForCreate(selectedDate = '') {
    document.getElementById('app-form').reset();
    document.getElementById('modal-title').innerText = "강의실 신청하기";
    document.getElementById('form-action').value = "create";
    document.getElementById('form-row-id').value = "";
    if (selectedDate) document.getElementById('form-date').value = selectedDate;
    document.getElementById('app-modal').style.display = 'flex';
  }

  // 모달 열기 (수정)
  function openModalForUpdate(item) {
    document.getElementById('modal-title').innerText = "신청 내역 수정하기";
    document.getElementById('form-action').value = "update";
    document.getElementById('form-row-id').value = item.rowId || item.rowIndex || item._rowIndex;

    document.getElementById('form-date').value = item['1순위 희망일'] || '';
    document.getElementById('form-time').value = item['1순위 시간'] || '';
    document.getElementById('form-room').value = item['강의실'] || '';
    document.getElementById('form-count').value = item['신청인원'] || 0;
    document.getElementById('form-dept').value = item['학과명'] || '';
    document.getElementById('form-className').value = item['분반명'] || '';
    document.getElementById('form-priority2').value = item['2순위 가능일시'] || '';
    document.getElementById('form-priority3').value = item['3순위 가능일시'] || '';
    document.getElementById('form-note').value = item['특이사항'] || '';
    document.getElementById('form-applicantName').value = item['신청자 이름'] || '';
    document.getElementById('form-pw').value = item['비밀번호'] || '';

    document.getElementById('app-modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('app-modal').style.display = 'none';
  }

  // 신청 / 수정 Submit 처리
  function handleFormSubmit(e) {
    e.preventDefault();

    const action = document.getElementById('form-action').value;
    const rowId = document.getElementById('form-row-id').value;

    const payload = {
      action: action,
      rowId: rowId,
      date: document.getElementById('form-date').value,
      time: document.getElementById('form-time').value,
      room: document.getElementById('form-room').value,
      count: document.getElementById('form-count').value,
      dept: document.getElementById('form-dept').value,
      className: document.getElementById('form-className').value,
      priority2: document.getElementById('form-priority2').value,
      priority3: document.getElementById('form-priority3').value,
      note: document.getElementById('form-note').value,
      applicantName: document.getElementById('form-applicantName').value,
      pw: document.getElementById('form-pw').value,
      adminPw: isAdminLoggedIn ? "1494" : ""
    };

    sendApiRequest(payload, (res) => {
      if (res.result === 'success') {
        alert(action === 'create' ? "성공적으로 신청되었습니다." : "성공적으로 수정되었습니다.");
        closeModal();
        fetchData();
      } else {
        alert("오류 발생: " + (res.message || "처리 실패"));
      }
    });
  }

  // 삭제 요청 처리
  function deleteApplication(rowId, pw) {
    if (!confirm("정말 이 신청 내역을 삭제하시겠습니까? (시트에서도 완전 삭제됩니다)")) return;

    const payload = {
      action: "delete",
      rowId: rowId,
      pw: pw,
      adminPw: isAdminLoggedIn ? "1494" : ""
    };

    sendApiRequest(payload, (res) => {
      if (res.result === 'success') {
        alert("삭제가 성공적으로 완료되었습니다.");
        fetchData();
        // 조회 화면 업데이트
        const searchName = document.getElementById('search-name').value;
        if (searchName) searchApplications();
      } else {
        alert("삭제 실패: " + (res.message || "비밀번호가 일치하지 않거나 오류가 발생했습니다."));
      }
    });
  }

  // JSONP 연동 함수
  function sendApiRequest(payload, callback) {
    const callbackName = 'cb_' + Date.now();
    window[callbackName] = function(res) {
      callback(res);
      delete window[callbackName];
      document.body.removeChild(script);
    };

    const queryParams = new URLSearchParams();
    queryParams.append('callback', callbackName);
    for (let key in payload) {
      queryParams.append(key, payload[key]);
    }

    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?${queryParams.toString()}`;
    document.body.appendChild(script);
  }

  // 신청 내역 조회
  function searchApplications() {
    const name = document.getElementById('search-name').value.trim();
    const pw = document.getElementById('search-pw').value.trim();
    const container = document.getElementById('search-results');

    if (!name || !pw) {
      alert("신청자 이름과 비밀번호를 모두 입력해주세요.");
      return;
    }

    // 이름 및 비밀번호 문자열 트리밍 비교
    const filtered = allData.filter(item => {
      const appName = String(item['신청자 이름'] || '').trim();
      const appPw = String(item['비밀번호'] || '').trim();
      return appName === name && appPw === pw;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<p style="color:var(--danger-color); font-weight:bold; margin-top:15px;">일치하는 신청 내역이 없습니다. 이름과 비밀번호를 다시 확인하세요.</p>`;
      return;
    }

    let html = `<table>
      <thead>
        <tr>
          <th>희망일</th><th>시간</th><th>강의실</th><th>인원</th><th>학과</th><th>분반</th><th>관리</th>
        </tr>
      </thead><tbody>`;

    filtered.forEach(item => {
      const rId = item.rowId || item.rowIndex || item._rowIndex;
      const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');
      html += `
        <tr>
          <td>${item['1순위 희망일']}</td>
          <td>${item['1순위 시간']}</td>
          <td>${item['강의실']}</td>
          <td>${item['신청인원']}</td>
          <td>${item['학과명']}</td>
          <td>${item['분반명']}</td>
          <td>
            <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick='openModalForUpdate(${itemJson})'>수정</button>
            <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deleteApplication(${rId}, '${item['비밀번호']}')">삭제</button>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  // 관리자 기능
  function adminLogin() {
    const pw = document.getElementById('admin-pw-input').value;
    if (pw === "1494") {
      isAdminLoggedIn = true;
      document.getElementById('admin-login-sec').style.display = 'none';
      document.getElementById('admin-content-sec').style.display = 'block';
      renderAdminTable();
    } else {
      alert("관리자 비밀번호가 올바르지 않습니다.");
    }
  }

  function adminLogout() {
    isAdminLoggedIn = false;
    document.getElementById('admin-login-sec').style.display = 'flex';
    document.getElementById('admin-content-sec').style.display = 'none';
    document.getElementById('admin-pw-input').value = '';
  }

  function renderAdminTable() {
    const container = document.getElementById('admin-table-container');
    if (allData.length === 0) {
      container.innerHTML = "<p>등록된 신청 내역이 없습니다.</p>";
      return;
    }

    let html = `<table>
      <thead>
        <tr>
          <th>행 번호</th><th>신청자</th><th>희망일</th><th>시간</th><th>강의실</th><th>학과</th><th>관리</th>
        </tr>
      </thead><tbody>`;

    allData.forEach(item => {
      const rId = item.rowId || item.rowIndex || item._rowIndex;
      const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');
      html += `
        <tr>
          <td>${rId}</td>
          <td>${item['신청자 이름']}</td>
          <td>${item['1순위 희망일']}</td>
          <td>${item['1순위 시간']}</td>
          <td>${item['강의실']}</td>
          <td>${item['학과명']}</td>
          <td>
            <button class="btn" style="padding: 4px 8px; font-size: 12px;" onclick='openModalForUpdate(${itemJson})'>수정</button>
            <button class="btn btn-danger" style="padding: 4px 8px; font-size: 12px;" onclick="deleteApplication(${rId}, '')">삭제</button>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }
</script>
</body>
</html>
