<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시설/강의실 예약 시스템</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .nav-btn {
      padding: 8px 16px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-header {
      text-align: center;
      font-weight: 600;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 6px;
    }

    .day-cell {
      min-height: 120px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .day-cell.other-month {
      background: #f8fafc;
      opacity: 0.5;
    }

    .date-num {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .room-badge {
      font-size: 11px;
      padding: 4px 6px;
      margin-top: 4px;
      border-radius: 4px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    /* 로딩 레이어 */
    #loadingOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      display: none;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
      z-index: 1000;
    }
  </style>
</head>
<body>

<div id="loadingOverlay">데이터 동기화 중...</div>

<div class="container">
  <div class="header">
    <button class="nav-btn" onclick="changeMonth(-1)">◀ 이전달</button>
    <h2 id="currentMonthStr"></h2>
    <button class="nav-btn" onclick="changeMonth(1)">다음달 ▶</button>
  </div>

  <div class="calendar-grid" id="calendarHeader">
    <div class="day-header" style="color: #ef4444;">일</div>
    <div class="day-header">월</div>
    <div class="day-header">화</div>
    <div class="day-header">수</div>
    <div class="day-header">목</div>
    <div class="day-header">금</div>
    <div class="day-header" style="color: #2563eb;">토</div>
  </div>

  <div class="calendar-grid" id="calendarGrid" style="margin-top: 8px;"></div>
</div>

<script>
  // 업데이트된 구글 앱스크립트 배포 URL
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytw1it3EPaIj2wM0sLGuGE7tr9EJXdhbSZe8Sw7BvHPKFr96gvRdW252HVoZ2EGuTzcw/exec";

  let currentDate = new Date();
  let applications = [];

  window.addEventListener("DOMContentLoaded", () => {
    fetchServerData(true);
  });

  async function fetchServerData(showLoading = false) {
    if (showLoading) {
      document.getElementById("loadingOverlay").style.display = "flex";
    }

    try {
      // 브라우저 캐시 방지를 위한 타임스탬프 쿼리
      const cacheBuster = GOOGLE_SCRIPT_URL.includes('?') ? '&_t=' + Date.now() : '?_t=' + Date.now();
      const res = await fetch(GOOGLE_SCRIPT_URL + cacheBuster, { redirect: "follow" });
      const data = await res.json();
      
      if (Array.isArray(data)) {
        applications = data.map(app => {
          // YYYY-MM-DD 형태로 정확히 정규화
          let cleanDate = String(app.date || '').trim();
          const nums = cleanDate.match(/\d+/g);
          if (nums && nums.length >= 3) {
            const y = nums[0];
            const m = nums[1].padStart(2, '0');
            const d = nums[2].padStart(2, '0');
            cleanDate = `${y}-${m}-${d}`;
          }

          return {
            ...app,
            date: cleanDate,
            time: String(app.time || '').trim(),
            room: String(app.room || '').trim(),
            count: Number(app.count) || 0
          };
        });
      } else {
        applications = [];
      }
      
      console.log("동기화 성공 (총 " + applications.length + "건):", applications);
    } catch (err) {
      console.error("데이터 로딩 실패:", err);
    } finally {
      if (showLoading) {
        document.getElementById("loadingOverlay").style.display = "none";
      }
      renderCalendar();
    }
  }

  function changeMonth(diff) {
    currentDate.setMonth(currentDate.getMonth() + diff);
    renderCalendar();
  }

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("currentMonthStr").innerText = `${year}년 ${month + 1}월`;

    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    // 이전 달 날짜들
    for (let i = firstDay - 1; i >= 0; i--) {
      const cell = document.createElement("div");
      cell.className = "day-cell other-month";
      cell.innerHTML = `<div class="date-num">${prevLastDate - i}</div>`;
      grid.appendChild(cell);
    }

    // 현재 달 날짜들
    for (let d = 1; d <= lastDate; d++) {
      const cell = document.createElement("div");
      cell.className = "day-cell";

      const monthStr = String(month + 1).padStart(2, '0');
      const dayStr = String(d).padStart(2, '0');
      const dateKey = `${year}-${monthStr}-${dayStr}`;

      cell.innerHTML = `<div class="date-num">${d}</div>`;

      // 해당 날짜의 신청 내역 필터링 및 집계
      const dayApps = applications.filter(app => app.date === dateKey);

      // 강의실별 인원 합산
      const roomCounts = {};
      dayApps.forEach(app => {
        const roomName = app.room || "강의실 미지정";
        roomCounts[roomName] = (roomCounts[roomName] || 0) + app.count;
      });

      // 강의실별 신청 인원 배지 표시
      Object.keys(roomCounts).forEach(room => {
        const badge = document.createElement("div");
        badge.className = "room-badge";
        badge.innerText = `${room} (${roomCounts[room]}명)`;
        cell.appendChild(badge);
      });

      grid.appendChild(cell);
    }
  }
</script>

</body>
</html>
