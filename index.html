<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 디지털 리터러시 with AI 신청(09~11월 운영) 🤖</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root { 
      --primary-color: #2563eb; 
      --danger-color: #dc2626; 
      --gray-bg: #f8fafc; 
      --border-color: #e2e8f0; 
      --success-color: #16a34a; 
    }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 10px; 
      background-color: #f1f5f9; 
      color: #1e293b; 
    }
    .container { 
      max-width: 1400px; 
      margin: 0 auto; 
      background: white; 
      padding: 15px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
      box-sizing: border-box;
    }
    
    .header-area { 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: space-between; 
      align-items: center; 
      gap: 10px; 
      margin-bottom: 15px; 
      border-bottom: 2px solid var(--border-color); 
      padding-bottom: 15px; 
    }
    h1 { 
      margin: 0; 
      font-size: 1.2rem; 
      color: #0f172a; 
      word-break: keep-all; 
    }
    .top-btns { 
      display: flex; 
      gap: 6px; 
      flex-wrap: wrap; 
    }
    .btn { 
      padding: 8px 12px; 
      border: none; 
      border-radius: 6px; 
      font-size: 0.8rem; 
      cursor: pointer; 
      font-weight: 600; 
      white-space: nowrap; 
    }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-admin { background: #475569; color: white; }
    .btn-excel { background: #16a34a; color: white; }
    .btn-secondary { background: #94a3b8; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn-save { background: #2563eb; color: white; }

    .notice-banner { 
      background: #fffbebfb; 
      border: 1px solid #fef3c7; 
      border-left: 5px solid #f59e0b; 
      padding: 10px 12px; 
      border-radius: 6px; 
      margin-bottom: 15px; 
      font-size: 0.82rem; 
      color: #92400e; 
      line-height: 1.6; 
    }

    .admin-panel { 
      background: #f8fafc; 
      border: 1px solid #cbd5e1; 
      padding: 15px; 
      border-radius: 8px; 
      margin-bottom: 20px; 
      display: none; 
    }
    .admin-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 10px; 
      margin-bottom: 12px; 
    }
    .admin-grid label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; }
    .admin-grid input { width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 0.8rem; }
    .admin-action-bar { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 10px; flex-wrap: wrap; }

    /* 메인 레이아웃 및 모바일 대응 */
    .main-layout { display: flex; gap: 20px; align-items: flex-start; }
    .calendar-section { flex: 2.4; min-width: 0; width: 100%; }
    .form-section { flex: 1; background: #f8fafc; border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; width: 100%; box-sizing: border-box; }

    @media (max-width: 768px) {
      body { margin: 5px; }
      .container { padding: 10px; }
      .main-layout { flex-direction: column; gap: 15px; }
      .calendar-section, .form-section { flex: none; width: 100%; }
      .calendar-grid { gap: 4px; }
      .day-cell { min-height: 100px; padding: 4px; }
      .slot-item { font-size: 0.68rem; padding: 4px; }
      .room-line { font-size: 0.62rem; flex-direction: column; }
      .form-row { flex-direction: column; gap: 0; }
    }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .day-header { text-align: center; font-weight: bold; padding: 6px; background: #f1f5f9; border-radius: 6px; color: #475569; font-size: 0.8rem; }
    
    .day-cell { background: white; border: 1px solid var(--border-color); border-radius: 6px; min-height: 130px; padding: 6px; display: flex; flex-direction: column; overflow: hidden; }
    .day-cell.empty-cell { background: transparent; border: none; }
    .day-cell.chuseok-cell { background: #fff7ed; border-color: #fed7aa; }
    .day-cell.holiday-cell { background: #fef2f2; border-color: #fecdd3; }
    .day-cell.out-of-period-cell { background: #f8fafc; color: #94a3b8; }
    
    .date-number { font-weight: bold; font-size: 0.82rem; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .chuseok-tag, .holiday-tag { font-size: 0.65rem; padding: 1px 4px; border-radius: 8px; font-weight: bold; }
    .chuseok-tag { color: #c2410c; background: #ffedd5; }
    .holiday-tag { color: var(--danger-color); background: #ffe4e6; }

    .slot-item { font-size: 0.72rem; padding: 5px; margin-bottom: 4px; border-radius: 4px; background: #f8fafc; border: 1px solid #e2e8f0; cursor: pointer; }
    .slot-item:hover { background: #eff6ff; border-color: #bfdbfe; }
    .slot-title { font-weight: bold; color: #1e293b; margin-bottom: 2px; }
    .room-line { display: flex; justify-content: space-between; margin-top: 1px; font-size: 0.68rem; }
    .status-ok { color: var(--success-color); font-weight: 600; }
    .status-no { color: var(--danger-color); font-weight: 600; }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 3px; color: #475569; }
    .form-group label.req::after { content: " *"; color: var(--danger-color); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 0.82rem; }
    .form-row { display: flex; gap: 6px; }
    .form-btns { display: flex; gap: 6px; margin-top: 12px; }

    .slot-info-box { background: #e0f2fe; border: 1px solid #7dd3fc; border-radius: 6px; padding: 8px; margin-bottom: 10px; font-size: 0.78rem; display: none; }
    .slot-info-box select { margin-top: 4px; width: 100%; padding: 4px; font-size: 0.75rem; }

    .admin-list-container { margin-top: 15px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; display: none; }
    .admin-app-item { background: white; border: 1px solid #e2e8f0; border-radius: 4px; padding: 6px; margin-bottom: 4px; font-size: 0.75rem; cursor: pointer; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; box-sizing: border-box; }
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); justify-content: center; align-items: center; z-index: 2000; font-weight: bold; color: var(--primary-color); }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">⏳ 처리 중입니다...</div>

<div class="container">
  <div class="header-area">
    <h1>&lt;2026 디지털 리터러시 with AI 신청(09~11월 운영) 🤖&gt;</h1>
    <div class="top-btns">
      <button class="btn btn-secondary" onclick="fetchServerData(true)">🔄 새로고침</button>
      <button class="btn btn-primary" onclick="openMyAuthModal()">내 신청 조회</button>
      <button class="btn btn-admin" id="adminToggleBtn" onclick="toggleAdminAuth()">관리자 로그인</button>
    </div>
  </div>

  <div class="notice-banner">
    <div>※ 분반별 1번 2시간 진행됩니다.</div>
    <div>※ 동시간대 2분반 진행 가능합니다. (단, 목요일은 강의실1만 운영)</div>
    <div>※ 강의실별 최대 40명까지 신청 가능합니다.</div>
    <div>※ 추석 연휴 및 공휴일(10/5 대체공휴일, 10/9 한글날)은 신청 불가합니다.</div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <h3>⚙️ 관리자 설정</h3>
    <div class="admin-grid">
      <div><label>운영 시작일</label><input type="date" id="cfgStartDate" value="2026-09-15"></div>
      <div><label>운영 종료일</label><input type="date" id="cfgEndDate" value="2026-11-14"></div>
      <div><label>강의실1 최대인원</label><input type="number" id="cfgMaxRoom1" value="40"></div>
      <div><label>강의실2 최대인원</label><input type="number" id="cfgMaxRoom2" value="40"></div>
      <div><label>동시간대 통합 인원</label><input type="number" id="cfgMaxTotal" value="80"></div>
    </div>
    <div class="admin-action-bar">
      <button class="btn btn-save" onclick="saveAdminConfig()">💾 설정 저장</button>
      <button class="btn btn-excel" onclick="downloadExcel()">📊 엑셀 다운로드</button>
    </div>
  </div>

  <div class="main-layout">
    <div class="calendar-section">
      <div class="calendar-header">
        <button class="btn btn-secondary" onclick="prevMonth()">&lt; 이전달</button>
        <h2 id="monthTitle" style="margin:0; font-size: 1rem;"></h2>
        <button class="btn btn-secondary" onclick="nextMonth()">다음달 &gt;</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>

      <div class="admin-list-container" id="adminListContainer">
        <h4 style="margin:0 0 8px 0;">📋 전체 신청 내역 (관리자용)</h4>
        <div id="adminAppList"></div>
      </div>
    </div>

    <div class="form-section" id="formSection">
      <h3 id="formTitle" style="margin-top:0; border-bottom:2px solid var(--primary-color); padding-bottom:5px;">📝 프로그램 신청</h3>
      
      <div class="slot-info-box" id="slotInfoBox">
        <div id="slotInfoText">📌 선택 일시 신청 건 수: 0건</div>
        <select id="slotAppSelect" onchange="loadSelectedSlotApp(this.value)">
          <option value="">-- 기존 신청 내역 선택 수정 --</option>
        </select>
      </div>

      <form id="applyForm" onsubmit="handleApplySubmit(event)">
        <input type="hidden" id="appRowIndex" value="">

        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label class="req">1순위 날짜</label>
            <input type="date" id="appDate" required onchange="onDateOrTimeChange()">
          </div>
          <div class="form-group" style="flex:1;">
            <label class="req">1순위 시간</label>
            <select id="appTime" required onchange="onDateOrTimeChange()">
              <option value="10:00~12:00">10:00~12:00</option>
              <option value="14:00~16:00">14:00~16:00</option>
              <option value="16:00~18:00">16:00~18:00</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label class="req">강의실</label>
            <select id="appRoom" required>
              <option value="강의실1">강의실1</option>
              <option value="강의실2">강의실2</option>
            </select>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="req">신청 인원</label>
            <input type="number" id="appCount" min="1" max="40" value="1" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label class="req">학과명</label>
            <input type="text" id="appDept" placeholder="예: 간호학과" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label>분반명</label>
            <input type="text" id="appClass" placeholder="예: A분반">
          </div>
        </div>

        <div class="form-group">
          <label class="req">2순위 가능 일시</label>
          <input type="text" id="appPriority2" placeholder="예: 2026-09-15 14:00~16:00" required>
        </div>
        <div class="form-group">
          <label class="req">3순위 가능 일시</label>
          <input type="text" id="appPriority3" placeholder="예: 2026-09-16 10:00~12:00" required>
        </div>

        <div class="form-group">
          <label>특이사항</label>
          <textarea id="appNote" rows="2" placeholder="전달사항 기재"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label class="req">신청자 이름</label>
            <input type="text" id="appName" placeholder="홍길동" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="req">비밀번호</label>
            <input type="password" id="appPw" placeholder="숫자 4자리" required>
          </div>
        </div>

        <div class="form-btns" id="normalFormBtns">
          <button type="submit" class="btn btn-primary" id="submitBtn" style="flex:1; padding:10px;">신청 제출하기</button>
        </div>

        <div class="form-btns" id="adminEditBtns" style="display:none;">
          <button type="button" class="btn btn-save" onclick="handleAdminUpdate()" style="flex:1;">💾 저장</button>
          <button type="button" class="btn btn-danger" onclick="handleAdminDelete()" style="flex:1;">🗑️ 삭제</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()" style="flex:0.8;">취소</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal" id="myAuthModal">
  <div class="modal-content">
    <h3 style="margin-top:0;">내 신청 내역 조회</h3>
    <div class="form-group"><label class="req">신청자 이름</label><input type="text" id="searchName" placeholder="홍길동"></div>
    <div class="form-group"><label class="req">비밀번호</label><input type="password" id="searchPw" placeholder="비밀번호"></div>
    <div class="form-btns">
      <button type="button" class="btn btn-secondary" onclick="closeModal('myAuthModal')">닫기</button>
      <button type="button" class="btn btn-primary" onclick="verifyAndShowMyList()">조회</button>
    </div>
  </div>
</div>

<div class="modal" id="myListModal">
  <div class="modal-content">
    <h3 style="margin-top:0;">나의 신청 목록</h3>
    <div id="myListContainer" style="max-height:250px; overflow-y:auto; margin-bottom:10px;"></div>
    <div style="text-align: right;"><button type="button" class="btn btn-secondary" onclick="closeModal('myListModal')">닫기</button></div>
  </div>
</div>

<script>
  // 업데이트된 구글 앱스크립트 웹 앱 URL
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnCjda7Wnz2rEz_dtF2O7JZBVq3HI5KSvRex8Qb8guTUalfxK8VP1FYPwzZPX3kci0xg/exec";

  let savedConfig = JSON.parse(localStorage.getItem("ai_config_v20") || "{}");
  let config = Object.assign({
    startDate: "2026-09-15",
    endDate: "2026-11-14",
    className: "",
    maxRoom1: 40,
    maxRoom2: 40,
    maxTotal: 80
  }, savedConfig);

  const TIME_SLOTS = ["10:00~12:00", "14:00~16:00", "16:00~18:00"];
  const HOLIDAYS = {
    "2026-09-24": { name: "추석 연휴", type: "chuseok" },
    "2026-09-25": { name: "추석", type: "chuseok" },
    "2026-10-05": { name: "대체휴일", type: "holiday" },
    "2026-10-09": { name: "한글날", type: "holiday" }
  };

  let currentYear = 2026;
  let currentMonth = 8; // 9월 (0부터 시작하므로 8=9월)
  let isAdminLoggedIn = false;
  let applications = [];

  function normalizeStr(str) { return String(str || '').replace(/[\s\:\-\~\._]/g, ''); }

  async function fetchServerData(showLoading = false) {
    if (!GOOGLE_SCRIPT_URL) { renderCalendar(); return; }
    if (showLoading) document.getElementById("loadingOverlay").style.display = "flex";

    try {
      const res = await fetch(GOOGLE_SCRIPT_URL, { redirect: "follow" });
      const data = await res.json();
      
      if (Array.isArray(data)) {
        applications = data.map((app, index) => {
          let rawDate = String(app.date || app["1순위 희망일"] || '').trim();
          if (rawDate.includes("T")) rawDate = rawDate.split("T")[0];
          let cleanDate = rawDate.replace(/[\.\/]/g, '-').replace(/\s+/g, '');
          const parts = cleanDate.match(/\d+/g);
          if (parts && parts.length >= 3) {
            cleanDate = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
          }

          return {
            ...app,
            appIdx: app.appIdx || index + 1,
            date: cleanDate,
            time: String(app.time || app["1순위 시간"] || '').trim(),
            room: String(app.room || app["강의실"] || '').trim(),
            count: parseInt(app.count || app["신청인원"]) || 0,
            dept: String(app.dept || app["학과명"] || '').trim(),
            className: String(app.className || app["분반명"] || '').trim(),
            priority2: String(app.priority2 || app["2순위 가능 일시"] || '').trim(),
            priority3: String(app.priority3 || app["3순위 가능 일시"] || '').trim(),
            note: String(app.note || app["특이사항"] || '').trim(),
            name: String(app.name || app["신청자 이름"] || '').trim(),
            pw: String(app.pw || app["비밀번호"] || '').replace(/^'/, '').trim()
          };
        });
      }
    } catch (err) {
      console.error("데이터 동기화 실패:", err);
    } finally {
      if (showLoading) document.getElementById("loadingOverlay").style.display = "none";
      renderCalendar();
    }
  }

  function toggleAdminAuth() {
    if (isAdminLoggedIn) {
      isAdminLoggedIn = false;
      document.getElementById("adminPanel").style.display = "none";
      document.getElementById("adminListContainer").style.display = "none";
      document.getElementById("slotInfoBox").style.display = "none";
      document.getElementById("adminToggleBtn").innerText = "관리자 로그인";
      resetForm();
    } else {
      const pw = prompt("관리자 비밀번호를 입력하세요:");
      if (pw === "1494") {
        isAdminLoggedIn = true;
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("adminListContainer").style.display = "block";
        document.getElementById("adminToggleBtn").innerText = "관리자 로그아웃";
        renderAdminAppList();
        onDateOrTimeChange();
      } else if (pw !== null) {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }
  }

  function getSlotStats(dateStr, timeStr) {
    const targetNormTime = normalizeStr(timeStr);
    const list = applications.filter(a => a.date === dateStr && normalizeStr(a.time) === targetNormTime);
    const room1Count = list.filter(a => a.room.includes("강의실1")).reduce((sum, a) => sum + a.count, 0);
    const room2Count = list.filter(a => a.room.includes("강의실2")).reduce((sum, a) => sum + a.count, 0);
    return { room1Count, room2Count, totalCount: room1Count + room2Count, list };
  }

  function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    ["월", "화", "수", "목", "금"].forEach(d => {
      const header = document.createElement("div");
      header.className = "day-header";
      header.innerText = d;
      grid.appendChild(header);
    });

    document.getElementById("monthTitle").innerText = `${currentYear}년 ${currentMonth + 1}월`;

    const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
    const firstDayOfWeek = new Date(currentYear, currentMonth, 1).getDay();
    let offset = (firstDayOfWeek >= 1 && firstDayOfWeek <= 5) ? firstDayOfWeek - 1 : 0;

    for (let i = 0; i < offset; i++) {
      grid.appendChild(Object.assign(document.createElement("div"), { className: "day-cell empty-cell" }));
    }

    for (let date = 1; date <= lastDate; date++) {
      const dayObj = new Date(currentYear, currentMonth, date);
      if (dayObj.getDay() === 0 || dayObj.getDay() === 6) continue;

      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      const holidayInfo = HOLIDAYS[dateStr];
      const isWithinPeriod = dateStr >= config.startDate && dateStr <= config.endDate;

      const cell = document.createElement("div");
      cell.className = holidayInfo ? (holidayInfo.type === "chuseok" ? "day-cell chuseok-cell" : "day-cell holiday-cell") : (!isWithinPeriod ? "day-cell out-of-period-cell" : "day-cell");

      const dateNum = document.createElement("div");
      dateNum.className = "date-number";
      dateNum.innerHTML = holidayInfo ? `<span>${date}일</span><span class="${holidayInfo.type==='chuseok'?'chuseok-tag':'holiday-tag'}">${holidayInfo.name}</span>` : `<span>${date}일</span>`;
      cell.appendChild(dateNum);

      if (isWithinPeriod && !holidayInfo) {
        TIME_SLOTS.forEach(time => {
          const stats = getSlotStats(dateStr, time);
          const isThursday = (dayObj.getDay() === 4);
          const isR1Closed = stats.room1Count >= config.maxRoom1 || stats.totalCount >= config.maxTotal;
          const isR2Closed = isThursday || stats.room2Count >= config.maxRoom2 || stats.totalCount >= config.maxTotal;

          const slotEl = document.createElement("div");
          slotEl.className = "slot-item";
          slotEl.onclick = () => selectSlotForForm(dateStr, time);
          slotEl.innerHTML = `
            <div class="slot-title">${time}</div>
            <div class="room-line"><span>강1(${stats.room1Count}/${config.maxRoom1})</span><span class="${isR1Closed?'status-no':'status-ok'}">${isR1Closed?'마감':'가능'}</span></div>
            <div class="room-line"><span>강2(${stats.room2Count}/${config.maxRoom2})</span><span class="${isR2Closed?'status-no':'status-ok'}">${isThursday?'마감':(isR2Closed?'마감':'가능')}</span></div>
          `;
          cell.appendChild(slotEl);
        });
      }
      grid.appendChild(cell);
    }
  }

  function selectSlotForForm(date, time) {
    document.getElementById("appDate").value = date;
    document.getElementById("appTime").value = time;
    updateSlotInfoBox(date, time);
    
    // 모바일 터치 시 신청서 위치로 부드럽게 스크롤 이동
    if (window.innerWidth <= 768) {
      document.getElementById("formSection").scrollIntoView({ behavior: "smooth" });
    }
  }

  function onDateOrTimeChange() {
    const date = document.getElementById("appDate").value;
    const time = document.getElementById("appTime").value;
    if (date && time) updateSlotInfoBox(date, time);
  }

  function updateSlotInfoBox(date, time) {
    if (!isAdminLoggedIn) return;
    const stats = getSlotStats(date, time);
    const box = document.getElementById("slotInfoBox");
    box.style.display = "block";
    document.getElementById("slotInfoText").innerText = `📌 [${date} ${time}] 접수: ${stats.list.length}건`;

    const selectEl = document.getElementById("slotAppSelect");
    selectEl.innerHTML = `<option value="">-- 내역 선택 수정 --</option>`;
    stats.list.forEach(app => {
      selectEl.innerHTML += `<option value="${app.appIdx}">[${app.room}] ${app.dept} / ${app.name}</option>`;
    });
  }

  function loadSelectedSlotApp(appIdx) {
    if (!appIdx) { resetForm(); return; }
    const app = applications.find(a => String(a.appIdx) === String(appIdx));
    if (!app) return;

    document.getElementById("appRowIndex").value = app.appIdx;
    document.getElementById("appDate").value = app.date;
    document.getElementById("appTime").value = app.time;
    document.getElementById("appRoom").value = app.room;
    document.getElementById("appCount").value = app.count;
    document.getElementById("appDept").value = app.dept;
    document.getElementById("appClass").value = app.className;
    document.getElementById("appPriority2").value = app.priority2;
    document.getElementById("appPriority3").value = app.priority3;
    document.getElementById("appNote").value = app.note;
    document.getElementById("appName").value = app.name;
    document.getElementById("appPw").value = app.pw;

    document.getElementById("formTitle").innerText = "✏️ 신청 내역 수정/삭제";
    document.getElementById("normalFormBtns").style.display = "none";
    document.getElementById("adminEditBtns").style.display = "flex";
  }

  function resetForm() {
    document.getElementById("formTitle").innerText = "📝 프로그램 신청";
    document.getElementById("appRowIndex").value = "";
    document.getElementById("applyForm").reset();
    document.getElementById("appDate").value = config.startDate;
    document.getElementById("slotInfoBox").style.display = "none";
    document.getElementById("normalFormBtns").style.display = "flex";
    document.getElementById("adminEditBtns").style.display = "none";
  }

  async function handleApplySubmit(e) {
    e.preventDefault();
    const payload = {
      action: "create",
      date: document.getElementById("appDate").value,
      time: document.getElementById("appTime").value,
      room: document.getElementById("appRoom").value,
      count: parseInt(document.getElementById("appCount").value),
      dept: document.getElementById("appDept").value.trim(),
      className: document.getElementById("appClass").value.trim(),
      priority2: document.getElementById("appPriority2").value.trim(),
      priority3: document.getElementById("appPriority3").value.trim(),
      note: document.getElementById("appNote").value.trim(),
      name: document.getElementById("appName").value.trim(),
      pw: document.getElementById("appPw").value.trim()
    };

    sendRequest(payload, "신청이 정상적으로 접수되었습니다!");
  }

  async function handleAdminUpdate() {
    const payload = {
      action: "update",
      appIdx: document.getElementById("appRowIndex").value,
      date: document.getElementById("appDate").value,
      time: document.getElementById("appTime").value,
      room: document.getElementById("appRoom").value,
      count: parseInt(document.getElementById("appCount").value),
      dept: document.getElementById("appDept").value.trim(),
      className: document.getElementById("appClass").value.trim(),
      priority2: document.getElementById("appPriority2").value.trim(),
      priority3: document.getElementById("appPriority3").value.trim(),
      note: document.getElementById("appNote").value.trim(),
      name: document.getElementById("appName").value.trim(),
      pw: document.getElementById("appPw").value.trim()
    };

    sendRequest(payload, "수정이 완료되었습니다.");
  }

  async function handleAdminDelete() {
    if (!confirm("정말 삭제하시겠습니까?")) return;
    const payload = {
      action: "delete",
      appIdx: document.getElementById("appRowIndex").value
    };

    sendRequest(payload, "삭제되었습니다.");
  }

  async function sendRequest(payload, successMsg) {
    document.getElementById("loadingOverlay").style.display = "flex";
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
      alert(successMsg);
      resetForm();
      setTimeout(() => fetchServerData(false), 1500);
    } catch (err) {
      alert("처리 중 오류가 발생했습니다.");
      console.error(err);
    } finally {
      document.getElementById("loadingOverlay").style.display = "none";
    }
  }

  function openMyAuthModal() { document.getElementById("myAuthModal").style.display = "flex"; }
  function closeModal(id) { document.getElementById(id).style.display = "none"; }

  function verifyAndShowMyList() {
    const name = document.getElementById("searchName").value.trim();
    const pw = document.getElementById("searchPw").value.trim();
    const myApps = applications.filter(a => a.name === name && String(a.pw) === pw);

    if (myApps.length === 0) { alert("일치하는 신청 정보가 없습니다."); return; }
    closeModal("myAuthModal");
    
    const container = document.getElementById("myListContainer");
    container.innerHTML = "";
    myApps.forEach(app => {
      container.innerHTML += `
        <div style="border:1px solid #cbd5e1; padding:8px; border-radius:5px; margin-bottom:6px; font-size:0.8rem;">
          <b>${app.date} [${app.time}] (${app.room})</b><br>학과: ${app.dept} (${app.count}명)
        </div>`;
    });
    document.getElementById("myListModal").style.display = "flex";
  }

  function renderAdminAppList() {
    const listEl = document.getElementById("adminAppList");
    listEl.innerHTML = "";
    applications.forEach(app => {
      listEl.innerHTML += `
        <div class="admin-app-item" onclick="loadSelectedSlotApp('${app.appIdx}')">
          <b>${app.date} [${app.time}]</b> ${app.dept} (${app.name})
        </div>`;
    });
  }

  function downloadExcel() {
    const worksheet = XLSX.utils.json_to_sheet(applications);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "신청내역");
    XLSX.writeFile(workbook, `신청내역.xlsx`);
  }

  function prevMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); }
  function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); }

  resetForm();
  fetchServerData(true);
</script>

</body>
</html>
