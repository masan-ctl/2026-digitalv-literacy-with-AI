<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2026 디지털 리터러시 with AI 신청(09~11월 운영) 🤖</title>
<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwt8vZLOqyQ_Zy-qwjpFfu8NZ3wBZuN_x4mqkeDn9DwUi8phVRQE7ARsfjyifu85xhBFw/exec";

  let config = JSON.parse(localStorage.getItem("ai_config_v19") || JSON.stringify({
    startDate: "2026-09-14",
    endDate: "2026-11-14",
    className: "",
    maxRoom1: 40,
    maxRoom2: 40,
    maxTotal: 80
  }));

  const TIME_SLOTS = ["10:00~12:00", "14:00~16:00", "16:00~18:00"];
  const HOLIDAYS = {
    "2026-09-24": { name: "추석 연휴", type: "chuseok", icon: "🌕", desc: "추석 연휴 휴무" },
    "2026-09-25": { name: "추석", type: "chuseok", icon: "🌕", desc: "추석 연휴 휴무" },
    "2026-10-05": { name: "대체휴일", type: "holiday", icon: "🍂", desc: "개천절 대체공휴일 휴무" },
    "2026-10-09": { name: "한글날", type: "holiday", icon: "🍂", desc: "한글날 공휴일 휴무" }
  };

  let currentYear = 2026;
  let currentMonth = 8; // 9월
  let isAdminLoggedIn = false;
  let editingId = null;
  let applications = [];

  async function fetchServerData() {
    if (!GOOGLE_SCRIPT_URL) {
      renderCalendar();
      return;
    }
    document.getElementById("loadingOverlay").style.display = "flex";
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL);
      const data = await res.json();
      applications = data;
    } catch (err) {
      console.error("데이터 로딩 실패:", err);
    } finally {
      document.getElementById("loadingOverlay").style.display = "none";
      renderCalendar(); // 서버 데이터를 다 받거나 실패해도 달력을 즉시 그립니다.
    }
  }

  function toggleAdminAuth() {
    if (isAdminLoggedIn) {
      isAdminLoggedIn = false;
      document.getElementById("adminPanel").style.display = "none";
      document.getElementById("adminListContainer").style.display = "none";
      document.getElementById("slotInfoBox").style.display = "none";
      document.getElementById("adminToggleBtn").innerText = "관리자 로그인";
    } else {
      const pw = prompt("관리자 비밀번호를 입력하세요:");
      if (pw === "1494") {
        isAdminLoggedIn = true;
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("adminListContainer").style.display = "block";
        document.getElementById("adminToggleBtn").innerText = "관리자 로그아웃";
        loadConfigToInputs();
        renderAdminAppList();
        onDateOrTimeChange();
      } else if (pw !== null) {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }
  }

  function loadConfigToInputs() {
    document.getElementById("cfgStartDate").value = config.startDate;
    document.getElementById("cfgEndDate").value = config.endDate;
    document.getElementById("cfgClassName").value = config.className;
    document.getElementById("cfgMaxRoom1").value = config.maxRoom1;
    document.getElementById("cfgMaxRoom2").value = config.maxRoom2;
    document.getElementById("cfgMaxTotal").value = config.maxTotal;
  }

  function saveAdminConfig() {
    config.startDate = document.getElementById("cfgStartDate").value;
    config.endDate = document.getElementById("cfgEndDate").value;
    config.className = document.getElementById("cfgClassName").value;
    config.maxRoom1 = parseInt(document.getElementById("cfgMaxRoom1").value) || 0;
    config.maxRoom2 = parseInt(document.getElementById("cfgMaxRoom2").value) || 0;
    config.maxTotal = parseInt(document.getElementById("cfgMaxTotal").value) || 0;

    localStorage.setItem("ai_config_v19", JSON.stringify(config));
    alert("관리자 설정이 저장되었습니다.");
    resetForm();
    renderCalendar();
  }

  function getSlotStats(dateStr, timeStr) {
    const list = applications.filter(a => a.date === dateStr && a.time === timeStr);
    const room1Count = list.filter(a => a.room === "강의실1").reduce((sum, a) => sum + Number(a.count), 0);
    const room2Count = list.filter(a => a.room === "강의실2").reduce((sum, a) => sum + Number(a.count), 0);
    const totalCount = room1Count + room2Count;

    return { room1Count, room2Count, totalCount, list };
  }

  function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const days = ["월", "화", "수", "목", "금"];
    days.forEach(d => {
      const header = document.createElement("div");
      header.className = "day-header";
      header.innerText = d;
      grid.appendChild(header);
    });

    document.getElementById("monthTitle").innerText = `${currentYear}년 ${currentMonth + 1}월`;

    const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
    const firstDayObj = new Date(currentYear, currentMonth, 1);
    const firstDayOfWeek = firstDayObj.getDay();

    let startOffset = firstDayOfWeek - 1;
    if (startOffset < 0) startOffset = 0;
    for (let i = 0; i < startOffset && i < 5; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "day-cell empty-cell";
      grid.appendChild(emptyCell);
    }

    for (let date = 1; date <= lastDate; date++) {
      const dayObj = new Date(currentYear, currentMonth, date);
      const dayOfWeek = dayObj.getDay();

      if (dayOfWeek === 0 || dayOfWeek === 6) continue;

      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      const holidayInfo = HOLIDAYS[dateStr];

      const cell = document.createElement("div");
      const isWithinPeriod = dateStr >= config.startDate && dateStr <= config.endDate;

      if (!isWithinPeriod) {
        cell.className = "day-cell disabled-cell";
      } else if (holidayInfo) {
        cell.className = holidayInfo.type === "chuseok" ? "day-cell chuseok-cell" : "day-cell holiday-cell";
      } else {
        cell.className = "day-cell";
      }

      const dateNum = document.createElement("div");
      dateNum.className = "date-number";

      if (holidayInfo && isWithinPeriod) {
        const tagClass = holidayInfo.type === "chuseok" ? "chuseok-tag" : "holiday-tag";
        dateNum.innerHTML = `<span>${date}일</span><span class="${tagClass}">${holidayInfo.name}</span>`;
      } else {
        dateNum.innerHTML = `<span>${date}일</span>`;
      }
      cell.appendChild(dateNum);

      if (isWithinPeriod) {
        if (holidayInfo) {
          const bannerBox = document.createElement("div");
          bannerBox.className = `holiday-banner-box ${holidayInfo.type !== "chuseok" ? 'red-border red-text' : ''}`;
          bannerBox.innerHTML = `<div class="icon">${holidayInfo.icon}</div><div class="title">${holidayInfo.name}</div><div class="desc">${holidayInfo.desc}</div>`;
          cell.appendChild(bannerBox);
        } else {
          TIME_SLOTS.forEach(time => {
            const stats = getSlotStats(dateStr, time);
            const isThursday = (dayOfWeek === 4);

            const isRoom1Closed = stats.room1Count >= config.maxRoom1 || stats.totalCount >= config.maxTotal;
            const isRoom2Closed = isThursday || stats.room2Count >= config.maxRoom2 || stats.totalCount >= config.maxTotal;

            const slotEl = document.createElement("div");
            slotEl.className = "slot-item";
            slotEl.innerHTML = `
              <div class="slot-title">${time}</div>
              <div class="room-line">
                <span>강의실1 (${stats.room1Count}/${config.maxRoom1}명)</span>
                <span class="${isRoom1Closed ? 'status-no' : 'status-ok'}">${isRoom1Closed ? '마감' : '가능'}</span>
              </div>
              <div class="room-line">
                <span>강의실2 (${stats.room2Count}/${config.maxRoom2}명)</span>
                <span class="${isRoom2Closed ? 'status-no' : 'status-ok'}">${isThursday ? '마감' : (isRoom2Closed ? '마감' : '가능')}</span>
              </div>
            `;
            slotEl.onclick = () => selectSlotForForm(dateStr, time);
            cell.appendChild(slotEl);
          });
        }
      }

      grid.appendChild(cell);
    }

    if (isAdminLoggedIn) renderAdminAppList();
  }

  function selectSlotForForm(date, time) {
    if (HOLIDAYS[date]) { alert("공휴일 및 연휴 기간은 신청할 수 없습니다."); return; }
    document.getElementById("appDate").value = date;
    document.getElementById("appTime").value = time;
    updateSlotInfoBox(date, time);
  }

  function onDateOrTimeChange() {
    const date = document.getElementById("appDate").value;
    const time = document.getElementById("appTime").value;
    if (date && time) updateSlotInfoBox(date, time);
  }

  function updateSlotInfoBox(date, time) {
    const box = document.getElementById("slotInfoBox");
    if (!isAdminLoggedIn) { box.style.display = "none"; return; }

    const stats = getSlotStats(date, time);
    const textEl = document.getElementById("slotInfoText");
    const selectEl = document.getElementById("slotAppSelect");

    box.style.display = "block";
    textEl.innerText = `📌 [${date} ${time}] 접수 건수: 총 ${stats.list.length}건`;

    selectEl.innerHTML = `<option value="">-- [${date}] 접수된 내역 선택 수정 --</option>`;
    stats.list.forEach(app => {
      const opt = document.createElement("option");
      opt.value = app.id;
      opt.innerText = `[${app.room}] ${app.dept} / ${app.name} (${app.count}명)`;
      selectEl.appendChild(opt);
    });
  }

  function resetForm() {
    editingId = null;
    document.getElementById("formTitle").innerText = "📝 프로그램 신청";
    document.getElementById("submitBtn").innerText = "신청 제출하기";
    document.getElementById("applyForm").reset();
    document.getElementById("appDate").value = config.startDate;
    document.getElementById("slotInfoBox").style.display = "none";
  }

  async function handleApplySubmit(e) {
    e.preventDefault();

    const date = document.getElementById("appDate").value;
    const time = document.getElementById("appTime").value;
    const room = document.getElementById("appRoom").value;
    const count = parseInt(document.getElementById("appCount").value);
    const dept = document.getElementById("appDept").value.trim();
    const className = document.getElementById("appClass").value.trim();
    const priority2 = document.getElementById("appPriority2").value.trim();
    const priority3 = document.getElementById("appPriority3").value.trim();
    const note = document.getElementById("appNote").value.trim();
    const name = document.getElementById("appName").value.trim();
    const pw = document.getElementById("appPw").value.trim();

    if (HOLIDAYS[date] || date < config.startDate || date > config.endDate) {
      alert("신청할 수 없는 일자입니다.");
      return;
    }

    const formData = { id: editingId || Date.now().toString(), date, time, room, count, dept, className, priority2, priority3, note, name, pw };

    document.getElementById("loadingOverlay").style.display = "flex";
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
      });
      alert("신청이 접수되었습니다!");
      resetForm();
      setTimeout(fetchServerData, 1000);
    } catch (err) {
      alert("제출 중 오류가 발생했습니다.");
    } finally {
      document.getElementById("loadingOverlay").style.display = "none";
    }
  }

  function openMyAuthModal() {
    document.getElementById("searchName").value = "";
    document.getElementById("searchPw").value = "";
    document.getElementById("myAuthModal").style.display = "flex";
  }

  function closeModal(id) { document.getElementById(id).style.display = "none"; }

  function verifyAndShowMyList() {
    const name = document.getElementById("searchName").value.trim();
    const pw = document.getElementById("searchPw").value.trim();
    const myApps = applications.filter(a => a.name === name && String(a.pw) === pw);

    if (myApps.length === 0) { alert("일치하는 신청 내역이 없습니다."); return; }
    closeModal("myAuthModal");
    renderMyList(myApps);
    document.getElementById("myListModal").style.display = "flex";
  }

  function renderMyList(myApps) {
    const container = document.getElementById("myListContainer");
    container.innerHTML = "";
    myApps.forEach(app => {
      const item = document.createElement("div");
      item.className = "my-item";
      item.innerHTML = `
        <div style="font-weight:bold; color:var(--primary-color);">1순위: ${app.date} [${app.time}] (${app.room})</div>
        <div>학과/분반: ${app.dept} / ${app.className || '미입력'} (${app.count}명)</div>
        <div>2순위: ${app.priority2 || '-'} | 3순위: ${app.priority3 || '-'}</div>
      `;
      container.appendChild(item);
    });
  }

  function renderAdminAppList() {
    const listEl = document.getElementById("adminAppList");
    listEl.innerHTML = "";
    applications.forEach(app => {
      const item = document.createElement("div");
      item.className = "admin-app-item";
      item.innerHTML = `<div><strong>${app.date} [${app.time}]</strong> - ${app.dept} (${app.name}, ${app.count}명) | ${app.room}</div>`;
      listEl.appendChild(item);
    });
  }

  function downloadExcel() {
    const worksheet = XLSX.utils.json_to_sheet(applications);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "신청내역");
    XLSX.writeFile(workbook, `신청내역_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function prevMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); }
  function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); }

  resetForm();
  fetchServerData();
</script>

</body>
</html>
