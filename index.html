<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 디지털 리터러시 with AI 신청(09~11월 운영) 🤖</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    header { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
    
    .btn { padding: 10px 18px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; font-size: 0.9rem; }
    .btn-primary { background: var(--primary-color); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: var(--text-main); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-excel { background: #16a34a; color: white; }

    .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    
    /* Calendar Header */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .calendar-header h2 { font-size: 1.25rem; }
    .month-nav { display: flex; gap: 8px; align-items: center; }

    /* Calendar Grid */
    .calendar-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .day-header { text-align: center; font-weight: 700; padding: 10px; background: #f1f5f9; border-radius: 8px; color: var(--text-muted); }
    
    .day-cell { border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; min-height: 140px; display: flex; flex-direction: column; gap: 6px; background: white; }
    .day-cell.empty-cell { background: #f8fafc; border: border: 1px dashed #e2e8f0; }
    .day-cell.disabled-cell { background: #f1f5f9; opacity: 0.6; }
    .day-cell.holiday-cell { background: #fef2f2; border-color: #fca5a5; }
    .day-cell.chuseok-cell { background: #fefce8; border-color: #fde047; }
    
    .date-number { font-weight: 700; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
    .holiday-tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #ef4444; color: white; font-weight: 500; }
    .chuseok-tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #eab308; color: white; font-weight: 500; }

    /* Time Slots */
    .slot-item { border: 1px solid var(--border-color); border-radius: 6px; padding: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; background: #fafafa; }
    .slot-item:hover { border-color: var(--primary-color); background: #eff6ff; }
    .slot-title { font-weight: 700; color: #334155; margin-bottom: 2px; }
    .room-line { display: flex; justify-content: space-between; margin-top: 2px; }
    .status-ok { color: #16a34a; font-weight: 700; }
    .status-no { color: #ef4444; font-weight: 700; }

    .holiday-banner-box { text-align: center; margin-top: 20px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.7); }
    .holiday-banner-box .icon { font-size: 1.5rem; }
    .holiday-banner-box .title { font-weight: 700; font-size: 0.85rem; margin-top: 4px; }
    .holiday-banner-box .desc { font-size: 0.75rem; color: var(--text-muted); }

    /* Form Styles */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: #334155; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); }
    
    .slot-info-box { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px; border-radius: 8px; margin-bottom: 14px; font-size: 0.85rem; display: none; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 24px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    
    .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.7); display:none; justify-content:center; align-items:center; z-index: 2000; font-weight:bold; font-size: 1.1rem; }
    
    .admin-panel { display: none; background: #fff7ed; border: 1px solid #ffedd5; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 10px; }
    
    .my-item { background: #f8fafc; border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; }
    .admin-app-item { border-bottom: 1px solid var(--border-color); padding: 8px 0; font-size: 0.85rem; }
  </style>
</head>
<body>

<div id="loadingOverlay" class="loading-overlay">⏳ 데이터를 불러오는 중입니다...</div>

<div class="container">
  <header>
    <div>
      <h1>2026 디지털 리터러시 with AI</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">운영기간: 2026-09-14 ~ 2026-11-14</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-secondary" onclick="openMyAuthModal()">내 신청 조회</button>
      <button class="btn btn-secondary" id="adminToggleBtn" onclick="toggleAdminAuth()">관리자 로그인</button>
    </div>
  </header>

  <!-- Admin Panel -->
  <div id="adminPanel" class="admin-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h3 style="color: #c2410c;">⚙️ 관리자 설정</h3>
      <button class="btn btn-excel" onclick="downloadExcel()">엑셀 다운로드</button>
    </div>
    <div class="admin-grid">
      <div class="form-group"><label>시작일</label><input type="date" id="cfgStartDate"></div>
      <div class="form-group"><label>종료일</label><input type="date" id="cfgEndDate"></div>
      <div class="form-group"><label>강의실1 정원</label><input type="number" id="cfgMaxRoom1"></div>
      <div class="form-group"><label>강의실2 정원</label><input type="number" id="cfgMaxRoom2"></div>
      <div class="form-group"><label>타임당 총 정원</label><input type="number" id="cfgMaxTotal"></div>
      <div class="form-group"><label>교육 과정명</label><input type="text" id="cfgClassName"></div>
    </div>
    <button class="btn btn-primary" onclick="saveAdminConfig()" style="width: 100%; margin-top: 10px;">관리자 설정 저장</button>
  </div>

  <div class="layout">
    <!-- Main Calendar -->
    <div class="card">
      <div class="calendar-header">
        <h2 id="monthTitle">2026년 9월</h2>
        <div class="month-nav">
          <button class="btn btn-secondary" onclick="prevMonth()">◀ 이전달</button>
          <button class="btn btn-secondary" onclick="nextMonth()">다음달 ▶</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- Application Form -->
    <div class="card">
      <h2 id="formTitle" style="font-size: 1.1rem; margin-bottom: 16px;">📝 프로그램 신청</h2>
      
      <div id="slotInfoBox" class="slot-info-box">
        <div id="slotInfoText"></div>
        <select id="slotAppSelect" style="margin-top: 8px; width: 100%; padding: 6px; border-radius: 4px; font-size: 0.8rem;"></select>
      </div>

      <form id="applyForm" onsubmit="handleApplySubmit(event)">
        <div class="form-group">
          <label>신청 일자</label>
          <input type="date" id="appDate" required onchange="onDateOrTimeChange()">
        </div>
        <div class="form-group">
          <label>신청 시간</label>
          <select id="appTime" required onchange="onDateOrTimeChange()">
            <option value="10:00~12:00">10:00 ~ 12:00</option>
            <option value="14:00~16:00">14:00 ~ 16:00</option>
            <option value="16:00~18:00">16:00 ~ 18:00</option>
          </select>
        </div>
        <div class="form-group">
          <label>희망 강의실</label>
          <select id="appRoom" required>
            <option value="강의실1">강의실1</option>
            <option value="강의실2">강의실2</option>
          </select>
        </div>
        <div class="form-group">
          <label>신청 인원 수</label>
          <input type="number" id="appCount" min="1" max="80" value="1" required>
        </div>
        <div class="form-group">
          <label>학과 / 부서</label>
          <input type="text" id="appDept" placeholder="예: 컴퓨터공학과" required>
        </div>
        <div class="form-group">
          <label>교과목/분반 (선택)</label>
          <input type="text" id="appClass" placeholder="예: AI개론 01분반">
        </div>
        <div class="form-group">
          <label>2순위 희망일시 (선택)</label>
          <input type="text" id="appPriority2" placeholder="예: 09-20 14:00~16:00">
        </div>
        <div class="form-group">
          <label>3순위 희망일시 (선택)</label>
          <input type="text" id="appPriority3" placeholder="예: 09-21 10:00~12:00">
        </div>
        <div class="form-group">
          <label>신청자 성명</label>
          <input type="text" id="appName" placeholder="홍길동" required>
        </div>
        <div class="form-group">
          <label>비밀번호 (조회/수정용 4자리)</label>
          <input type="password" id="appPw" maxlength="8" placeholder="숫자 4자리" required>
        </div>
        <div class="form-group">
          <label>비고 / 요청사항</label>
          <textarea id="appNote" rows="2" placeholder="요청사항을 입력하세요."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">신청 제출하기</button>
      </form>
    </div>
  </div>

  <!-- Admin List View Panel -->
  <div id="adminListContainer" class="card" style="display: none; margin-top: 20px;">
    <h3>📊 전체 신청 목록 (관리자 모드)</h3>
    <div id="adminAppList" style="margin-top: 12px; max-height: 300px; overflow-y: auto;"></div>
  </div>
</div>

<!-- 내 신청 조회 모달 -->
<div id="myAuthModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-bottom: 12px;">🔍 내 신청 내역 조회</h3>
    <div class="form-group">
      <label>신청자 성명</label>
      <input type="text" id="searchName" placeholder="성명 입력">
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="searchPw" placeholder="비밀번호 입력">
    </div>
    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;">
      <button class="btn btn-secondary" onclick="closeModal('myAuthModal')">취소</button>
      <button class="btn btn-primary" onclick="verifyAndShowMyList()">조회하기</button>
    </div>
  </div>
</div>

<div id="myListModal" class="modal-overlay">
  <div class="modal-content">
    <h3 style="margin-bottom: 12px;">📋 나의 신청 내역</h3>
    <div id="myListContainer" style="max-height: 300px; overflow-y: auto;"></div>
    <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
      <button class="btn btn-secondary" onclick="closeModal('myListModal')">닫기</button>
    </div>
  </div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwt8vZLOqyQ_Zy-qwjpFfu8NZ3wBZuN_x4mqkeDn9DwUi8phVRQE7ARsfjyifu85xhBFw/exec";

  let config = JSON.parse(localStorage.getItem("ai_config_v19") || JSON.stringify({
    startDate: "2026-09-14",
    endDate: "2026-11-14",
    className: "",
    maxRoom1: 40,
    maxRoom2: 40,
    maxTotal: 80
  }));

  const TIME_SLOTS = ["10:00~12:00", "14:00~16:00", "16:00~18:00"];
  const HOLIDAYS = {
    "2026-09-24": { name: "추석 연휴", type: "chuseok", icon: "🌕", desc: "추석 연휴 휴무" },
    "2026-09-25": { name: "추석", type: "chuseok", icon: "🌕", desc: "추석 연휴 휴무" },
    "2026-10-05": { name: "대체휴일", type: "holiday", icon: "🍂", desc: "개천절 대체공휴일 휴무" },
    "2026-10-09": { name: "한글날", type: "holiday", icon: "🍂", desc: "한글날 공휴일 휴무" }
  };

  let currentYear = 2026;
  let currentMonth = 8; // 9월
  let isAdminLoggedIn = false;
  let editingId = null;
  let applications = [];

  async function fetchServerData() {
    if (!GOOGLE_SCRIPT_URL) {
      renderCalendar();
      return;
    }
    document.getElementById("loadingOverlay").style.display = "flex";
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL);
      const data = await res.json();
      applications = data;
    } catch (err) {
      console.error("데이터 로딩 실패:", err);
    } finally {
      document.getElementById("loadingOverlay").style.display = "none";
      renderCalendar();
    }
  }

  function toggleAdminAuth() {
    if (isAdminLoggedIn) {
      isAdminLoggedIn = false;
      document.getElementById("adminPanel").style.display = "none";
      document.getElementById("adminListContainer").style.display = "none";
      document.getElementById("slotInfoBox").style.display = "none";
      document.getElementById("adminToggleBtn").innerText = "관리자 로그인";
    } else {
      const pw = prompt("관리자 비밀번호를 입력하세요:");
      if (pw === "1494") {
        isAdminLoggedIn = true;
        document.getElementById("adminPanel").style.display = "block";
        document.getElementById("adminListContainer").style.display = "block";
        document.getElementById("adminToggleBtn").innerText = "관리자 로그아웃";
        loadConfigToInputs();
        renderAdminAppList();
        onDateOrTimeChange();
      } else if (pw !== null) {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }
  }

  function loadConfigToInputs() {
    document.getElementById("cfgStartDate").value = config.startDate;
    document.getElementById("cfgEndDate").value = config.endDate;
    document.getElementById("cfgClassName").value = config.className;
    document.getElementById("cfgMaxRoom1").value = config.maxRoom1;
    document.getElementById("cfgMaxRoom2").value = config.maxRoom2;
    document.getElementById("cfgMaxTotal").value = config.maxTotal;
  }

  function saveAdminConfig() {
    config.startDate = document.getElementById("cfgStartDate").value;
    config.endDate = document.getElementById("cfgEndDate").value;
    config.className = document.getElementById("cfgClassName").value;
    config.maxRoom1 = parseInt(document.getElementById("cfgMaxRoom1").value) || 0;
    config.maxRoom2 = parseInt(document.getElementById("cfgMaxRoom2").value) || 0;
    config.maxTotal = parseInt(document.getElementById("cfgMaxTotal").value) || 0;

    localStorage.setItem("ai_config_v19", JSON.stringify(config));
    alert("관리자 설정이 저장되었습니다.");
    resetForm();
    renderCalendar();
  }

  function getSlotStats(dateStr, timeStr) {
    const list = applications.filter(a => a.date === dateStr && a.time === timeStr);
    const room1Count = list.filter(a => a.room === "강의실1").reduce((sum, a) => sum + Number(a.count), 0);
    const room2Count = list.filter(a => a.room === "강의실2").reduce((sum, a) => sum + Number(a.count), 0);
    const totalCount = room1Count + room2Count;

    return { room1Count, room2Count, totalCount, list };
  }

  function renderCalendar() {
    const grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";

    const days = ["월", "화", "수", "목", "금"];
    days.forEach(d => {
      const header = document.createElement("div");
      header.className = "day-header";
      header.innerText = d;
      grid.appendChild(header);
    });

    document.getElementById("monthTitle").innerText = `${currentYear}년 ${currentMonth + 1}월`;

    const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
    const firstDayObj = new Date(currentYear, currentMonth, 1);
    const firstDayOfWeek = firstDayObj.getDay();

    let startOffset = firstDayOfWeek - 1;
    if (startOffset < 0) startOffset = 0;
    for (let i = 0; i < startOffset && i < 5; i++) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "day-cell empty-cell";
      grid.appendChild(emptyCell);
    }

    for (let date = 1; date <= lastDate; date++) {
      const dayObj = new Date(currentYear, currentMonth, date);
      const dayOfWeek = dayObj.getDay();

      if (dayOfWeek === 0 || dayOfWeek === 6) continue;

      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
      const holidayInfo = HOLIDAYS[dateStr];

      const cell = document.createElement("div");
      const isWithinPeriod = dateStr >= config.startDate && dateStr <= config.endDate;

      if (!isWithinPeriod) {
        cell.className = "day-cell disabled-cell";
      } else if (holidayInfo) {
        cell.className = holidayInfo.type === "chuseok" ? "day-cell chuseok-cell" : "day-cell holiday-cell";
      } else {
        cell.className = "day-cell";
      }

      const dateNum = document.createElement("div");
      dateNum.className = "date-number";

      if (holidayInfo && isWithinPeriod) {
        const tagClass = holidayInfo.type === "chuseok" ? "chuseok-tag" : "holiday-tag";
        dateNum.innerHTML = `<span>${date}일</span><span class="${tagClass}">${holidayInfo.name}</span>`;
      } else {
        dateNum.innerHTML = `<span>${date}일</span>`;
      }
      cell.appendChild(dateNum);

      if (isWithinPeriod) {
        if (holidayInfo) {
          const bannerBox = document.createElement("div");
          bannerBox.className = `holiday-banner-box ${holidayInfo.type !== "chuseok" ? 'red-border red-text' : ''}`;
          bannerBox.innerHTML = `<div class="icon">${holidayInfo.icon}</div><div class="title">${holidayInfo.name}</div><div class="desc">${holidayInfo.desc}</div>`;
          cell.appendChild(bannerBox);
        } else {
          TIME_SLOTS.forEach(time => {
            const stats = getSlotStats(dateStr, time);
            const isThursday = (dayOfWeek === 4);

            const isRoom1Closed = stats.room1Count >= config.maxRoom1 || stats.totalCount >= config.maxTotal;
            const isRoom2Closed = isThursday || stats.room2Count >= config.maxRoom2 || stats.totalCount >= config.maxTotal;

            const slotEl = document.createElement("div");
            slotEl.className = "slot-item";
            slotEl.innerHTML = `
              <div class="slot-title">${time}</div>
              <div class="room-line">
                <span>강의실1 (${stats.room1Count}/${config.maxRoom1}명)</span>
                <span class="${isRoom1Closed ? 'status-no' : 'status-ok'}">${isRoom1Closed ? '마감' : '가능'}</span>
              </div>
              <div class="room-line">
                <span>강의실2 (${stats.room2Count}/${config.maxRoom2}명)</span>
                <span class="${isRoom2Closed ? 'status-no' : 'status-ok'}">${isThursday ? '마감' : (isRoom2Closed ? '마감' : '가능')}</span>
              </div>
            `;
            slotEl.onclick = () => selectSlotForForm(dateStr, time);
            cell.appendChild(slotEl);
          });
        }
      }

      grid.appendChild(cell);
    }

    if (isAdminLoggedIn) renderAdminAppList();
  }

  function selectSlotForForm(date, time) {
    if (HOLIDAYS[date]) { alert("공휴일 및 연휴 기간은 신청할 수 없습니다."); return; }
    document.getElementById("appDate").value = date;
    document.getElementById("appTime").value = time;
    updateSlotInfoBox(date, time);
  }

  function onDateOrTimeChange() {
    const date = document.getElementById("appDate").value;
    const time = document.getElementById("appTime").value;
    if (date && time) updateSlotInfoBox(date, time);
  }

  function updateSlotInfoBox(date, time) {
    const box = document.getElementById("slotInfoBox");
    if (!isAdminLoggedIn) { box.style.display = "none"; return; }

    const stats = getSlotStats(date, time);
    const textEl = document.getElementById("slotInfoText");
    const selectEl = document.getElementById("slotAppSelect");

    box.style.display = "block";
    textEl.innerText = `📌 [${date} ${time}] 접수 건수: 총 ${stats.list.length}건`;

    selectEl.innerHTML = `<option value="">-- [${date}] 접수된 내역 선택 수정 --</option>`;
    stats.list.forEach(app => {
      const opt = document.createElement("option");
      opt.value = app.id;
      opt.innerText = `[${app.room}] ${app.dept} / ${app.name} (${app.count}명)`;
      selectEl.appendChild(opt);
    });
  }

  function resetForm() {
    editingId = null;
    document.getElementById("formTitle").innerText = "📝 프로그램 신청";
    document.getElementById("submitBtn").innerText = "신청 제출하기";
    document.getElementById("applyForm").reset();
    document.getElementById("appDate").value = config.startDate;
    document.getElementById("slotInfoBox").style.display = "none";
  }

  async function handleApplySubmit(e) {
    e.preventDefault();

    const date = document.getElementById("appDate").value;
    const time = document.getElementById("appTime").value;
    const room = document.getElementById("appRoom").value;
    const count = parseInt(document.getElementById("appCount").value);
    const dept = document.getElementById("appDept").value.trim();
    const className = document.getElementById("appClass").value.trim();
    const priority2 = document.getElementById("appPriority2").value.trim();
    const priority3 = document.getElementById("appPriority3").value.trim();
    const note = document.getElementById("appNote").value.trim();
    const name = document.getElementById("appName").value.trim();
    const pw = document.getElementById("appPw").value.trim();

    if (HOLIDAYS[date] || date < config.startDate || date > config.endDate) {
      alert("신청할 수 없는 일자입니다.");
      return;
    }

    const formData = { id: editingId || Date.now().toString(), date, time, room, count, dept, className, priority2, priority3, note, name, pw };

    document.getElementById("loadingOverlay").style.display = "flex";
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
      });
      alert("신청이 접수되었습니다!");
      resetForm();
      setTimeout(fetchServerData, 1000);
    } catch (err) {
      alert("제출 중 오류가 발생했습니다.");
    } finally {
      document.getElementById("loadingOverlay").style.display = "none";
    }
  }

  function openMyAuthModal() {
    document.getElementById("searchName").value = "";
    document.getElementById("searchPw").value = "";
    document.getElementById("myAuthModal").style.display = "flex";
  }

  function closeModal(id) { document.getElementById(id).style.display = "none"; }

  function verifyAndShowMyList() {
    const name = document.getElementById("searchName").value.trim();
    const pw = document.getElementById("searchPw").value.trim();
    const myApps = applications.filter(a => a.name === name && String(a.pw) === pw);

    if (myApps.length === 0) { alert("일치하는 신청 내역이 없습니다."); return; }
    closeModal("myAuthModal");
    renderMyList(myApps);
    document.getElementById("myListModal").style.display = "flex";
  }

  function renderMyList(myApps) {
    const container = document.getElementById("myListContainer");
    container.innerHTML = "";
    myApps.forEach(app => {
      const item = document.createElement("div");
      item.className = "my-item";
      item.innerHTML = `
        <div style="font-weight:bold; color:var(--primary-color);">1순위: ${app.date} [${app.time}] (${app.room})</div>
        <div>학과/분반: ${app.dept} / ${app.className || '미입력'} (${app.count}명)</div>
        <div>2순위: ${app.priority2 || '-'} | 3순위: ${app.priority3 || '-'}</div>
      `;
      container.appendChild(item);
    });
  }

  function renderAdminAppList() {
    const listEl = document.getElementById("adminAppList");
    listEl.innerHTML = "";
    applications.forEach(app => {
      const item = document.createElement("div");
      item.className = "admin-app-item";
      item.innerHTML = `<div><strong>${app.date} [${app.time}]</strong> - ${app.dept} (${app.name}, ${app.count}명) | ${app.room}</div>`;
      listEl.appendChild(item);
    });
  }

  function downloadExcel() {
    const worksheet = XLSX.utils.json_to_sheet(applications);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "신청내역");
    XLSX.writeFile(workbook, `신청내역_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function prevMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); }
  function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } renderCalendar(); }

  resetForm();
  fetchServerData();
</script>

</body>
</html>
